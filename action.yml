name: 'detect-git-changes-action'
description: 'Detect changes in a git repository'

branding:
    icon: git-commit
    color: blue

inputs:
    base-ref:
        description: 'Base ref to compare from (branch/tag/sha).'
        required: false
    use-latest-tag:
        description:
            'If true, automatically use the latest tag as base (overrides
            base-ref).'
        required: false
        default: 'false'
    head-ref:
        description: 'Head ref to compare to (default: current HEAD).'
        required: false
        default: 'HEAD'
    paths:
        description:
            'Optional paths to limit the comparison to, as git pathspecs
            separated by commas or newlines. Combined with the preset when one
            is set.'
        required: false
    exclude-paths:
        description:
            'Optional paths to leave out of the comparison, as git pathspecs
            separated by commas or newlines. Applied after paths and preset.'
        required: false
    preset:
        description:
            'Optional preset that tracks the files that materially affect a
            package. Supported: python.'
        required: false

outputs:
    has-changes:
        description: 'true if changes exist, false otherwise.'
        value: ${{ steps.detect.outputs.has_changes }}
    changed-files-count:
        description: 'Number of changed files that count towards the verdict.'
        value: ${{ steps.detect.outputs.changed_files_count }}
    changed-files:
        description:
            'Newline-separated list of the changed files that count towards the
            verdict.'
        value: ${{ steps.detect.outputs.changed_files }}

runs:
    using: composite
    steps:
        - name: Ensure git history
          shell: bash
          run: |
              git fetch --prune --unshallow || true
              git fetch origin +refs/tags/*:refs/tags/* || true

              if [[ -n "${{ inputs.base-ref }}" ]] && [[ "${{ inputs.use-latest-tag }}" != "true" ]]; then
                git fetch origin ${{ inputs.base-ref }}:${{ inputs.base-ref }} || true
              fi

              if [[ "${{ inputs.head-ref }}" != "HEAD" ]]; then
                git fetch origin ${{ inputs.head-ref }}:${{ inputs.head-ref }} || true
              fi

        - id: detect
          shell: bash
          run: ${{ github.action_path }}/entrypoint.sh
          env:
              INPUT_BASE_REF: ${{ inputs.base-ref }}
              INPUT_USE_LATEST_TAG: ${{ inputs.use-latest-tag }}
              INPUT_HEAD_REF: ${{ inputs.head-ref }}
              INPUT_PATHS: ${{ inputs.paths }}
              INPUT_EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
              INPUT_PRESET: ${{ inputs.preset }}
