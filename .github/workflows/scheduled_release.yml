name: Scheduled Release

on:
    schedule:
        - cron: '0 0 * * 2'
    workflow_dispatch:

permissions:
    contents: write

jobs:
    check_changes:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            has-changes: ${{ steps.check_changes.outputs.has-changes }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0

            # Release only when something users get changed: what a caller runs
            # (the action definition, the scripts at the repository root, the
            # license), the documentation that explains how to use it, or the
            # citation metadata, so a docs or citation update reaches users
            # through a release too. Tests, CI workflows and tooling config
            # change none of them. Root-level globs keep a newly added script or
            # Markdown file (any case of `.md`) covered without editing this
            # list.
            - name: Check for changes to the action or its documentation
              id: check_changes
              uses: ./
              with:
                  use-latest-tag: 'true'
                  paths: 'action.yml,:(glob)*.sh,:(glob)*.py,LICENSE,CITATION.cff,:(glob)*.[mM][dD],docs/'

    test_action:
        needs: check_changes
        if: needs.check_changes.outputs.has-changes == 'true'
        uses: ./.github/workflows/test_action.yml

    test_unit:
        needs: check_changes
        if: needs.check_changes.outputs.has-changes == 'true'
        uses: ./.github/workflows/test_unit.yml

    create_tag:
        needs: [test_action, test_unit]
        runs-on: ubuntu-latest
        outputs:
            new_tag: ${{ steps.tag_version.outputs.new_tag }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0

            - name: Bump version and push tag
              id: tag_version
              uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  release_branches: main
                  default_bump: patch
                  tag_prefix: v

            - name: Output tag information
              run: |
                  echo "### Tag Created :rocket:" >> $GITHUB_STEP_SUMMARY
                  echo "- **New tag**: ${{ steps.tag_version.outputs.new_tag }}" >> $GITHUB_STEP_SUMMARY
                  echo "- **Previous tag**: ${{ steps.tag_version.outputs.previous_tag }}" >> $GITHUB_STEP_SUMMARY
                  echo "- **Changelog**: ${{ steps.tag_version.outputs.changelog }}" >> $GITHUB_STEP_SUMMARY

    release:
        needs: create_tag
        uses: ./.github/workflows/release.yml
        permissions:
            contents: write
            id-token: write
        with:
            tag_name: ${{ needs.create_tag.outputs.new_tag }}
